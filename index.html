<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GiBookmark — Curated Design & Tech Resources (279 Links)</title>
  <meta name="description" content="Tổng hợp 279 bookmark thiết kế đã sàng lọc & phân loại 7 mục theo phong cách Beautiful UI." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />

  <!-- Inter & JetBrains Mono fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/css/main.css" />
  <link rel="stylesheet" href="./src/css/components.css" />
</head>
<body>
  <!-- Beautiful UI Centered Main Container -->
  <div class="bui-container" id="buiApp">

    <!-- Mobile Header Bar -->
    <div class="mobile-header-bar">
      <div class="sidebar-logo">
        <div class="logo-icon-box">
          <img src="/favicon.png" alt="GiBookmark Logo" class="brand-logo-img" />
        </div>
        <span class="logo-title-text">GiBookmark</span>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Mở menu">
        ☰
      </button>
    </div>

    <!-- Grid Layout (Sidebar + Main Content) -->
    <div class="bui-grid-layout">
      <!-- Left Sidebar (288px) -->
      <aside class="sidebar" id="sidebar">
        <!-- Logo & Theme Toggle Row -->
        <div class="sidebar-brand-row">
          <div class="sidebar-logo">
            <div class="logo-icon-box">
              <img src="/favicon.png" alt="GiBookmark Logo" class="brand-logo-img" />
            </div>
            <span class="logo-title-text">GiBookmark</span>
          </div>

          <!-- Beautiful UI Sun/Moon Pill Theme Switcher -->
          <div class="theme-pill-toggle">
            <button class="theme-pill-btn active" id="themeLightBtn" aria-label="Giao diện sáng" title="Light Mode">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            </button>
            <button class="theme-pill-btn" id="themeDarkBtn" aria-label="Giao diện tối" title="Dark Mode">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
            </button>
          </div>
        </div>

        <h1 class="sidebar-headline">
          Bookmarks for design & code.
        </h1>

        <!-- Sidebar Category Navigation -->
        <div class="sidebar-nav-wrapper">
          <p class="nav-category-header">Categories (7)</p>
          <ul class="nav-list" id="sidebarNavList">
            <!-- Dynamically populated -->
          </ul>
        </div>
      </aside>

      <!-- Main Content Area -->
      <div class="main-content">
        <!-- Sticky Header & Search Bar -->
        <header class="main-header">
          <div class="search-field-wrapper">
            <span class="search-field-icon">🔍</span>
            <input 
              type="text" 
              id="searchInput" 
              class="search-field-input" 
              placeholder="Search 279 bookmarks, tags, domains..." 
              autocomplete="off"
            />
            <span class="search-shortcut-badge">/</span>
            <button class="clear-search-btn" id="clearSearchBtn" aria-label="Xóa tìm kiếm">✕</button>
          </div>

          <!-- Grid vs List View Pill -->
          <div class="view-toggle-pill">
            <button class="view-toggle-btn active" id="gridViewBtn">Grid</button>
            <button class="view-toggle-btn" id="listViewBtn">List</button>
          </div>
        </header>

        <!-- Main Body Showcase -->
        <div id="showcaseContainer">
          <!-- Category Sections or Single View Section Container -->
          <div id="sectionsWrapper">
            <!-- Dynamically populated showcase sections -->
          </div>
        </div>

        <!-- Footer -->
        <footer class="bui-footer">
          GiBookmark • Crafted primitives for design & tech bookmarks • 279 Verified Links (7 Categories)
        </footer>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- App JavaScript Bundle -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
